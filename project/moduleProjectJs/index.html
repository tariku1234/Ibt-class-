<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHODA</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="header">
        <div class="logo">SHODA</div>
        <div class="search-container">
            <input type="search" id="product-search" placeholder="search shoes name" class="search-input">
        </div>
        <div class="cart-wrapper">
            <button id="cart-button">
                🛒 Cart
                <span id="cart-count">0</span>
            </button>
            <div class="cart-dropdown" id="cart-dropdown">
                <h3>Your Cart</h3>
                <div id="cart-items">
                </div>
                <div class="cart-total">
                    Total: $<span id="cart-total">0</span>
                </div>
            </div>
        </div>
    </div>
    <div class="home">
        <h1> welcome to shoda </h1>
        <p>see choos your wanted shoes select add to cart the order the product we deliver for you as fast as posible
        </p>
    </div>
    <div class="product-page">
        <section class="products-section">

            <h2>Our Shoes Collection</h2>

            <div class="product-container" id="product-container">



            </div>

        </section>

    </div>
    <div class="footer">


    </div>
    <div class="floating-cart" id="floating-cart">

        🛒

        <span id="floating-count">
            0
        </span>

    </div>

    <script src="app.js" defer></script>
</body>

</html>
