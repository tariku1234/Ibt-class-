    <form action="/reserve" method="post">
        <lable for="name">Name </lable>

        <select name="branch">
            <option>Bole</option>
            <option>Kazanchis</option>
        </select>
    </form>

        <label for="phone">Phone</label>
        <input id="phone" name="phone" type="tel" placeholder="0911...">

    <form>
