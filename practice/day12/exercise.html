<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Habesha Eatery</title>
</head>

<body>
    <h1>Habesha Eatery</h1>
    <p>Welcome to Habesha Eatery</p>

    <form action="">
        <label for="name">Name</label>
        <input id="name" name="name" type="text" required />
        <label for="email">Email</label>
        <input id="email" name="email" type="email" required />
        <label for="telephone">Phone Number</label>
        <input id="telephone" name="telephone" type="tel" required />
        <lable for="date">Date</lable>
        <input id="date" type="date" required />
        <label for="size">Party Size</label>
        <input id="size" type="number" min="1" max="10" />
        <label for="special">Special Request</label>
        <textarea id="special" name="special" rows="4" cols="50"></textarea>
        <button type="submit">Reserve</button>



    </form>
    <table>
        <caption>menu table</caption>
        <thead>
            <tr>
                <th scope="col">Item</th>
                <th scope="col">Price</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Injera</td>
                <td>25.00</td>
            </tr>
            <tr>
                <td>Doro Wat</td>
                <td>500</td>
            </tr>
            <tr>
                <td>Tibs</td>
                <td>400.00</td>
            </tr>
    </table>
    <iframe src="16105524_1520615651343469_5911176631173997891_n.jpg" alt="habesha eatery" referrerpolicy="refer">

    </iframe>
</body>

</html>
