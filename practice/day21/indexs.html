<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup Form</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <main>

        <h1>Signup Form</h1>
        <form id="signup-form">
            <label for="name">
                Full Name
            </label>

            <input id="name" type="text" placeholder="Enter your name" />

            <label for="phone">
                Phone Number
            </label>
            <input id="phone" type="text" placeholder="09xxxxxxxx" />

            <button type="submit">
                Sign Up
            </button>

            <p id="error"></p>
        </form>
        <h2>
            Registered People:
            <span id="count">0</span>
        </h2>
        <ul id="users"></ul>
    </main>
    <script src="app.js"></script>

</body>

</html>
